[project]
name = "figuras-cientificas"
version = "0.1.0"
description = "Paletas, estilos y verificación de accesibilidad para figuras científicas."
readme = "README.md"
requires-python = ">=3.12"

# Sin pines de version: uv.lock fija la resolucion exacta.
dependencies = [
    "cmcrameri>=1.10",
    "colorspacious>=1.1.2",
    "matplotlib>=3.11",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figuras_cientificas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
